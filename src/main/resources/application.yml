server:
  servlet:
    context-path: /api
  port: ${AUTH_SERVICE_PORT:9000}

spring:
  application:
    name: auth-service

  config:
    import: optional:file:.env[.properties],optional:file:src/main/resources/.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  security:
    token:
      secret: ${JWT_API_KEY}
